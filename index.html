<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary SEO Meta Tags -->
    <title>CommitStreak — Daily GitHub Coding Streak Monitor &amp; Developer Portfolio</title>
    <meta name="title" content="CommitStreak — Daily GitHub Coding Streak Monitor &amp; Developer Portfolio" />
    <meta name="description" content="Track your daily GitHub coding streaks, analyze commit habits, inspect language analytics, showcase repositories, and document your engineering journey with CommitStreak." />

    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Structured Data (JSON-LD) for Search Engines -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebApplication",
          "@id": "https://commitstreak.vercel.app/#webapp",
          "name": "CommitStreak",
          "url": "https://commitstreak.vercel.app/",
          "description": "Real-time GitHub coding streak tracker, repository showcase, and developer engineering journal.",
          "applicationCategory": "DeveloperApplication",
          "operatingSystem": "All",
          "browserRequirements": "Requires JavaScript. Requires HTML5.",
          "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "USD"
          },
          "featureList": [
            "Real-time GitHub Streak Tracking",
            "Public Repository Visualizer and Showcase",
            "Language Usage Breakdown Analytics",
            "Commit Velocity & Activity Graphs",
            "Engineering Daily Dev Journal"
          ]
        },
        {
          "@type": "WebSite",
          "@id": "https://commitstreak.vercel.app/#website",
          "url": "https://commitstreak.vercel.app/",
          "name": "CommitStreak",
          "description": "Daily GitHub Activity & Streak Monitor",
          "potentialAction": {
            "@type": "SearchAction",
            "target": {
              "@type": "EntryPoint",
              "urlTemplate": "https://commitstreak.vercel.app/?user={search_term_string}"
            },
            "query-input": "required name=search_term_string"
          }
        }
      ]
    }
    </script>

    <!-- Google Fonts: Inter and JetBrains Mono with Preconnect -->
